# Every push and pull request: no credentials, tests pass, the tracker is consistent, every pinned evidence file in the
# repo still has its pinned hash, the committed snapshot matches the files, and the site builds from it.
# Snapshot and pins are checked before the steps that write files (tests/last_run.json, tracker/trace.*).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cc-research
    steps:
      - uses: actions/checkout@v4
        with:
          path: cc-research          # pins of file sets include the folder name
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: cc-research/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - name: Secret scan
        run: python tools/secret_scan.py
      - name: Snapshot matches the committed files
        run: python tracker/snapshot.py --check
      - name: Evidence pins
        run: python tools/ci_check.py
      - name: Unit tests
        run: python tests/run_tests.py
      - name: Tracker consistency
        run: python tracker/trace.py check
      - name: Site builds from the snapshot
        run: python site/build.py
      - name: Inside Causal-Copilot builds from the committed model
        run: python site/copilot/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: cc-research/site/_build
          retention-days: 7
